
services:
  db:
    image: postgres:15-alpine
    container_name: politica_db
    environment:
      POSTGRES_DB: politica_pedagogia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: politica_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=politica_pedagogia
      - DB_USER=postgres
      - DB_PASSWORD=password123
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: politica_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
